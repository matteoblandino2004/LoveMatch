name: Deploy website

on:
  push:
    branches:
      - main
      - claude/matchmaking-app-friends-family-o191bu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than queueing behind.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `enablement: true` turns Pages on for the repo if it is off, so there
      # is nothing to click in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the site
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
